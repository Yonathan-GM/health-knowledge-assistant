services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hka
      POSTGRES_PASSWORD: hka_password
      POSTGRES_DB: hka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hka"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+pg8000://hka:hka_password@db:5432/hka
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  pgdata: